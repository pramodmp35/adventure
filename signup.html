<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — STACKLY Adventure Travel</title>

    <!-- ===== CDN: Tailwind + Bootstrap + Icons ===== -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- ===== CDN: GSAP + AOS ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- ===== Google Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ===== RESET & BASE ===== */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        overflow-x: hidden !important;
        width: 100%;
        height: 100%;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #f8fafc;
        color: #0b192c;
        overflow-x: hidden !important;
        width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img,
      iframe,
      video,
      svg {
        max-width: 100%;
        display: block;
      }

      a,
      button,
      .btn {
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
      }

      /* ===== SIGNUP PAGE WRAPPER ===== */
      .signup-wrapper {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
        position: relative;
        overflow: hidden;
      }

      .signup-wrapper::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200&q=80")
          center center / cover no-repeat;
        opacity: 0.06;
        z-index: 0;
        animation: bgPulse 30s ease-in-out infinite alternate;
      }

      @keyframes bgPulse {
        0% {
          transform: scale(1);
          opacity: 0.05;
        }
        100% {
          transform: scale(1.05);
          opacity: 0.1;
        }
      }

      .signup-wrapper .floating-icon {
        position: absolute;
        font-size: 3rem;
        color: rgba(255, 107, 53, 0.06);
        z-index: 0;
        pointer-events: none;
        animation: float 10s ease-in-out infinite alternate;
      }

      .signup-wrapper .floating-icon:nth-child(1) {
        top: 8%;
        left: 4%;
        font-size: 4rem;
        animation-delay: 0s;
      }
      .signup-wrapper .floating-icon:nth-child(2) {
        bottom: 12%;
        right: 4%;
        font-size: 3.5rem;
        animation-delay: 2.5s;
      }
      .signup-wrapper .floating-icon:nth-child(3) {
        top: 30%;
        right: 8%;
        font-size: 2.5rem;
        animation-delay: 5s;
      }
      .signup-wrapper .floating-icon:nth-child(4) {
        bottom: 35%;
        left: 6%;
        font-size: 3rem;
        animation-delay: 1.5s;
      }

      @keyframes float {
        0% {
          transform: translateY(0px) rotate(0deg);
        }
        100% {
          transform: translateY(-25px) rotate(8deg);
        }
      }

      /* ===== SIGNUP CARD ===== */
      .signup-card {
        position: relative;
        z-index: 1;
        max-width: 440px;
        width: 100%;
        padding: 2.5rem 2rem 2.2rem;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(16px);
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow:
          0 24px 64px rgba(11, 25, 44, 0.08),
          0 4px 16px rgba(11, 25, 44, 0.04);
      }

      /* ===== LOGO ===== */
      .signup-logo {
        text-align: center;
        margin-bottom: 1.8rem;
      }

      .signup-logo img {
        height: 56px;
        width: auto;
        margin: 0 auto;
        object-fit: contain;
      }

      .signup-logo .logo-placeholder {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        font-weight: 800;
        font-size: 1.6rem;
        color: #0b192c;
        letter-spacing: -0.02em;
      }

      .signup-logo .logo-placeholder .brand-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #ff6b35, #e85d2c);
        border-radius: 14px;
        color: #fff;
        font-size: 1.4rem;
      }

      .signup-logo .logo-placeholder span {
        background: linear-gradient(135deg, #0b192c, #1a2f44);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .signup-logo .logo-placeholder .accent-text {
        background: linear-gradient(135deg, #ff6b35, #f7c948);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ===== FORM ELEMENTS ===== */
      .signup-card .form-label {
        font-weight: 600;
        font-size: 0.85rem;
        color: #1a2f44;
        margin-bottom: 0.3rem;
      }

      .signup-card .form-control {
        border-radius: 14px;
        padding: 0.8rem 1.2rem;
        border: 1.5px solid #e9edf2;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        background: #fafbfc;
        color: #0b192c;
      }

      .signup-card .form-control:focus {
        border-color: #ff6b35;
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        background: #fff;
      }

      .signup-card .form-control::placeholder {
        color: #9aabb8;
        font-weight: 400;
      }

      .signup-card .input-group-text {
        border-radius: 14px 0 0 14px;
        background: #fafbfc;
        border: 1.5px solid #e9edf2;
        border-right: none;
        color: #6b7a8a;
      }

      .signup-card .input-group .form-control {
        border-radius: 0 14px 14px 0;
      }

      /* ===== ROLE SELECTOR ===== */
      .role-selector {
        display: flex;
        gap: 0.6rem;
        background: #f0f2f5;
        border-radius: 16px;
        padding: 0.3rem;
        border: 1px solid #e9edf2;
      }

      .role-selector .role-btn {
        flex: 1;
        padding: 0.6rem 0.8rem;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.85rem;
        color: #4a5a6e;
        background: transparent;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .role-selector .role-btn.active {
        background: #fff;
        color: #0b192c;
        box-shadow: 0 2px 12px rgba(11, 25, 44, 0.08);
      }

      .role-selector .role-btn:hover:not(.active) {
        color: #0b192c;
      }

      .role-selector .role-btn .role-icon {
        margin-right: 0.4rem;
      }

      /* ===== BUTTONS ===== */
      .btn-signup {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        width: 100%;
        background: linear-gradient(135deg, #ff6b35, #e85d2c);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.85rem 1.5rem;
        border-radius: 50px;
        border: none;
        box-shadow: 0 6px 24px rgba(255, 107, 53, 0.3);
        transition: all 0.3s ease;
      }

      .btn-signup:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 40px rgba(255, 107, 53, 0.45);
        color: #fff;
      }

      .btn-signup i {
        font-size: 1.1rem;
        transition: transform 0.3s ease;
      }

      .btn-signup:hover i {
        transform: translateX(4px);
      }

      /* ===== LINKS ===== */
      .signup-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.6rem;
        font-size: 0.88rem;
      }

      .signup-links a {
        color: #4a5a6e;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .signup-links a:hover {
        color: #ff6b35;
      }

      .signup-links .login-link {
        color: #ff6b35;
        font-weight: 600;
      }

      .signup-links .login-link:hover {
        color: #d94f1e;
        text-decoration: underline;
      }

      .signup-links .back-home {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        color: #6b7a8a;
        font-size: 0.85rem;
      }

      .signup-links .back-home:hover {
        color: #0b192c;
      }

      /* ===== DIVIDER ===== */
      .signup-divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        color: #9aabb8;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .signup-divider::before,
      .signup-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e9edf2;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 767.98px) {
        .signup-wrapper {
          padding: 1.5rem 1rem;
          min-height: 100vh;
          align-items: center;
        }

        .signup-card {
          padding: 2rem 1.2rem 1.8rem;
          border-radius: 24px;
        }

        .signup-logo img {
          height: 44px;
        }

        .signup-logo .logo-placeholder {
          font-size: 1.3rem;
        }

        .signup-logo .logo-placeholder .brand-icon {
          width: 40px;
          height: 40px;
          font-size: 1.2rem;
        }

        .signup-card .form-control {
          padding: 0.7rem 1rem;
          font-size: 0.9rem;
        }

        .role-selector .role-btn {
          font-size: 0.8rem;
          padding: 0.5rem 0.6rem;
        }

        .btn-signup {
          font-size: 0.95rem;
          padding: 0.75rem 1.2rem;
        }

        .signup-links {
          font-size: 0.82rem;
          flex-direction: column;
          align-items: center;
          gap: 0.4rem;
        }

        .signup-links .back-home {
          font-size: 0.8rem;
        }

        .signup-wrapper .floating-icon {
          font-size: 2rem !important;
        }
        .signup-wrapper .floating-icon:nth-child(1) {
          font-size: 2.5rem !important;
        }
        .signup-wrapper .floating-icon:nth-child(2) {
          font-size: 2rem !important;
        }
        .signup-wrapper .floating-icon:nth-child(3) {
          font-size: 1.8rem !important;
        }
        .signup-wrapper .floating-icon:nth-child(4) {
          font-size: 2.2rem !important;
        }

        .signup-wrapper::before {
          opacity: 0.04;
        }
      }

      @media (max-width: 575.98px) {
        .signup-wrapper {
          padding: 1rem 0.75rem;
        }

        .signup-card {
          padding: 1.5rem 1rem 1.5rem;
          border-radius: 20px;
        }

        .signup-logo img {
          height: 38px;
        }

        .signup-logo .logo-placeholder {
          font-size: 1.1rem;
        }

        .signup-logo .logo-placeholder .brand-icon {
          width: 36px;
          height: 36px;
          font-size: 1rem;
        }

        .signup-card .form-control {
          padding: 0.6rem 0.9rem;
          font-size: 0.85rem;
          border-radius: 12px;
        }

        .role-selector {
          border-radius: 12px;
          padding: 0.2rem;
        }

        .role-selector .role-btn {
          font-size: 0.75rem;
          padding: 0.4rem 0.5rem;
          border-radius: 10px;
        }

        .btn-signup {
          font-size: 0.9rem;
          padding: 0.7rem 1rem;
          border-radius: 40px;
        }

        .signup-links {
          font-size: 0.78rem;
        }

        .signup-wrapper .floating-icon {
          display: none;
        }
      }

      @media (min-width: 768px) {
        .signup-card {
          padding: 3rem 2.5rem 2.5rem;
        }
      }

      /* ===== AOS overrides ===== */
      [data-aos] {
        pointer-events: none;
      }
      [data-aos].aos-animate {
        pointer-events: auto;
      }

      /* ===== Toast / Alert ===== */
      .toast-message {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: #0b192c;
        color: #fff;
        padding: 0.8rem 1.8rem;
        border-radius: 16px;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 8px 32px rgba(11, 25, 44, 0.2);
        opacity: 0;
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
        transform: translateX(-50%) translateY(20px);
        pointer-events: none;
        max-width: 90%;
        text-align: center;
      }

      .toast-message.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .toast-message.success {
        background: #0b192c;
      }

      .toast-message.error {
        background: #d94f1e;
      }
    </style>
  </head>

  <body>
    <!-- ============================================================
    TOAST MESSAGE
    ============================================================ -->
    <div class="toast-message" id="toastMessage"></div>

    <!-- ============================================================
    SIGNUP PAGE
    ============================================================ -->
    <div class="signup-wrapper">
      <!-- Decorative Floating Icons -->
      <span class="floating-icon"><i class="bi bi-compass-fill"></i></span>
      <span class="floating-icon"><i class="bi bi-tree-fill"></i></span>
      <span class="floating-icon"><i class="bi bi-mountain-fill"></i></span>
      <span class="floating-icon"><i class="bi bi-binoculars-fill"></i></span>

      <!-- Signup Card -->
      <div
        class="signup-card"
        data-aos="fade-up"
        data-aos-duration="800"
        data-aos-delay="100"
      >
        <!-- ===== LOGO ===== -->
        <div
          class="signup-logo"
          data-aos="fade-down"
          data-aos-duration="600"
          data-aos-delay="150"
        >
          <!-- Replace the src with your actual logo -->
          <img
            src="./assets/logo.webp"
            alt="STACKLY Adventure Travel"
            id="companyLogo"
            style="
              height: 56px;
              width: auto;
              margin: 0 auto;
              object-fit: contain;
            "
          />
          <noscript>
            <div class="logo-placeholder">
              <span class="brand-icon"><i class="bi bi-compass-fill"></i></span>
              <span>STACK<span class="accent-text">LY</span></span>
            </div>
          </noscript>
        </div>

        <!-- ===== WELCOME TEXT ===== -->
        <div class="text-center mb-4" data-aos="fade-up" data-aos-delay="200">
          <h2
            style="
              font-size: clamp(1.2rem, 2.5vw, 1.6rem);
              font-weight: 700;
              color: #0b192c;
              letter-spacing: -0.02em;
            "
          >
            Create Your Account
          </h2>
          <p style="color: #4a5a6e; font-size: 0.92rem; margin: 0">
            Join the STACKLY adventure community
          </p>
        </div>

        <!-- ===== FORM ===== -->
        <form id="signupForm" data-aos="fade-up" data-aos-delay="250">
          <!-- Full Name -->
          <div class="mb-3">
            <label for="fullNameInput" class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-person-fill"></i
              ></span>
              <input
                type="text"
                class="form-control"
                id="fullNameInput"
                placeholder="e.g. Alex Rivera"
              />
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="emailInput" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-envelope-fill"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="emailInput"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="passwordInput" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-lock-fill"></i
              ></span>
              <input
                type="password"
                class="form-control"
                id="passwordInput"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPasswordInput" class="form-label"
              >Confirm Password</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-shield-lock-fill"></i
              ></span>
              <input
                type="password"
                class="form-control"
                id="confirmPasswordInput"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <!-- ===== ROLE SELECTOR ===== -->
          <div class="mb-4">
            <label class="form-label d-block">Sign up as</label>
            <div class="role-selector" id="roleSelector">
              <button type="button" class="role-btn active" data-role="user">
                <i class="bi bi-person-fill role-icon"></i> USER
              </button>
              <button type="button" class="role-btn" data-role="admin">
                <i class="bi bi-shield-fill-check role-icon"></i> ADMIN
              </button>
            </div>
          </div>

          <!-- Hidden role input -->
          <input type="hidden" id="selectedRole" value="user" />

          <!-- ===== SIGNUP BUTTON ===== -->
          <button type="submit" class="btn-signup mb-3">
            Create Account <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <!-- ===== LINKS ===== -->
        <div class="signup-links" data-aos="fade-up" data-aos-delay="300">
          <a href="./login.html" class="login-link">
            <i class="bi bi-box-arrow-in-right me-1"></i> Already have an
            account? Login
          </a>
        </div>

        <!-- ===== DIVIDER ===== -->
        <div
          class="signup-divider my-3"
          data-aos="fade-up"
          data-aos-delay="350"
        >
          <span>or</span>
        </div>

        <!-- ===== BACK TO HOME ===== -->
        <div class="text-center" data-aos="fade-up" data-aos-delay="400">
          <a href="index.html" class="back-home">
            <i class="bi bi-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // ===== GSAP Entrance Animation =====
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
        tl.fromTo(
          ".signup-card",
          { opacity: 0, y: 30, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8 },
        )
          .fromTo(
            ".signup-logo",
            { opacity: 0, y: 15 },
            { opacity: 1, y: 0, duration: 0.5 },
            "-=0.4",
          )
          .fromTo(
            ".signup-card .text-center",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5 },
            "-=0.3",
          )
          .fromTo(
            "#signupForm",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5 },
            "-=0.3",
          )
          .fromTo(
            ".signup-links",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.4 },
            "-=0.2",
          )
          .fromTo(
            ".signup-divider",
            { opacity: 0 },
            { opacity: 1, duration: 0.3 },
            "-=0.2",
          )
          .fromTo(
            ".back-home",
            { opacity: 0 },
            { opacity: 1, duration: 0.3 },
            "-=0.2",
          );

        // ===== Role Selector =====
        const roleButtons = document.querySelectorAll(".role-btn");
        const selectedRoleInput = document.getElementById("selectedRole");

        roleButtons.forEach((btn) => {
          btn.addEventListener("click", function () {
            roleButtons.forEach((b) => b.classList.remove("active"));
            this.classList.add("active");
            const role = this.getAttribute("data-role");
            selectedRoleInput.value = role;
          });
        });

        // ===== AOS Init =====
        AOS.init({
          duration: 700,
          easing: "ease-out-cubic",
          once: true,
          offset: 20,
          disable: window.innerWidth < 576 ? true : false,
        });

        // ===== Toast System =====
        const toast = document.getElementById("toastMessage");

        function showToast(message, type = "success") {
          toast.textContent = message;
          toast.className = "toast-message " + type + " show";
          clearTimeout(toast._hideTimer);
          toast._hideTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 3000);
        }

        // ===== SIGNUP FORM HANDLER =====
        const signupForm = document.getElementById("signupForm");

        signupForm.addEventListener("submit", function (e) {
          e.preventDefault();

          const fullName = document
            .getElementById("fullNameInput")
            .value.trim();
          const email = document.getElementById("emailInput").value.trim();
          const password = document
            .getElementById("passwordInput")
            .value.trim();
          const confirmPassword = document
            .getElementById("confirmPasswordInput")
            .value.trim();
          const role = selectedRoleInput.value;

          // Validation
          if (!fullName) {
            showToast("Please enter your full name.", "error");
            return;
          }

          if (!email) {
            showToast("Please enter your email address.", "error");
            return;
          }

          if (!email.includes("@") || !email.includes(".")) {
            showToast("Please enter a valid email address.", "error");
            return;
          }

          if (!password) {
            showToast("Please create a password.", "error");
            return;
          }

          if (password.length < 6) {
            showToast("Password must be at least 6 characters.", "error");
            return;
          }

          if (password !== confirmPassword) {
            showToast("Passwords do not match.", "error");
            return;
          }

          // ===== STORE USER DATA IN LOCAL STORAGE =====
          // Store the email with role for dashboard display
          localStorage.setItem("stackly_user_email", email);
          localStorage.setItem("stackly_user_role", role);
          localStorage.setItem("stackly_user_name", fullName);
          localStorage.setItem("stackly_last_login", new Date().toISOString());

          // Also store in a JSON object for structured data
          const userData = {
            name: fullName,
            email: email,
            role: role,
            signupTime: new Date().toISOString(),
            lastLogin: new Date().toISOString(),
          };
          localStorage.setItem("stackly_user_data", JSON.stringify(userData));

          // ===== SHOW SUCCESS AND REDIRECT TO LOGIN =====
          showToast(
            "Account created successfully! Redirecting to login...",
            "success",
          );

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        });

        // ===== Handle any stray CTA clicks =====
        document
          .querySelectorAll(
            'a[href]:not([href="login.html"]):not([href="index.html"]):not([href^="#"]):not([href^="javascript:"])',
          )
          .forEach((el) => {
            // Skip if it's the login or home link
            if (
              el.getAttribute("href") !== "login.html" &&
              el.getAttribute("href") !== "index.html" &&
              !el.classList.contains("back-home") &&
              !el.classList.contains("login-link")
            ) {
              el.addEventListener("click", function (e) {
                e.preventDefault();
                window.location.href = "./404.html";
              });
            }
          });

        // ===== Ensure no horizontal scroll =====
        window.addEventListener("resize", function () {
          if (document.documentElement.scrollWidth > window.innerWidth) {
            document.body.style.overflowX = "hidden";
          }
        });
      });
    </script>
  </body>
</html>
